<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NekoNext · 💜</title>
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6f0ff;--ink:#24183f;--mut:#5e507f;--line:#e3d8fb;--violet:#6d4ae0;--violet2:#8a6bff;--heart:#ff5c8a;--card:#fff;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{min-height:100vh;color:var(--ink);font:17px/1.6 var(--body);
  background:radial-gradient(900px 600px at 100% -10%,rgba(255,143,184,.22),transparent 60%),radial-gradient(900px 700px at -10% 110%,rgba(124,92,255,.2),transparent 60%),var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 48px}
.brand{display:inline-flex;align-items:center;gap:10px;font:800 20px var(--display);color:var(--violet);text-decoration:none}.brand img{width:34px;height:34px;border-radius:9px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;margin-top:28px}
h1{font:800 clamp(38px,5.4vw,60px)/1.05 var(--display);margin:6px 0 12px;opacity:0;animation:up .6s .1s ease forwards}
.lead{font-size:18px;color:var(--mut);margin:0 0 20px;max-width:46ch;opacity:0;animation:up .6s .25s ease forwards}
.rs{display:flex;flex-wrap:wrap;gap:10px;opacity:0;animation:up .6s .4s ease forwards}
.rs button{font:700 15px var(--body);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.rs button:hover{transform:translateY(-2px);border-color:var(--violet2);box-shadow:0 8px 20px rgba(109,74,224,.15)}
.rs button.on{background:linear-gradient(135deg,var(--violet2),var(--violet));color:#fff;border-color:transparent;box-shadow:0 10px 24px rgba(109,74,224,.35)}
.rs.done button:not(.on){opacity:.55}
.more{display:none;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 10px 26px rgba(60,30,120,.08);animation:up .45s ease forwards}
.more.show{display:block}
.more .ok{font-weight:800;color:#1d9a64;margin-bottom:10px}
.more label{display:block;font-weight:700;font-size:14px;color:var(--mut);margin:8px 0 4px}
.more input,.more textarea{width:100%;font:15px var(--body);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fbf9ff;outline:none}
.more input:focus,.more textarea:focus{border-color:var(--violet2)}
.more textarea{min-height:76px;resize:vertical}
.more .row{display:flex;justify-content:flex-end;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:800 15px var(--body);border-radius:12px;padding:10px 18px;border:0;cursor:pointer}
.btn.p{color:#fff;background:linear-gradient(135deg,var(--violet2),var(--violet));box-shadow:0 10px 22px rgba(109,74,224,.3)}
.btn.s{color:var(--violet);background:#fff;border:1px solid var(--line)}
.sent{display:none;font-weight:800;color:var(--violet)}
.back{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;opacity:0;animation:up .6s .55s ease forwards}
.back span{color:var(--mut);font-size:15px}
.anon{margin-top:14px;font-size:13px;color:var(--mut);opacity:0;animation:up .6s .6s ease forwards}
.err{display:none;color:#c2410c;font-size:14px;margin-top:8px}
/* Neko */
.art{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:440px;opacity:0;animation:pop .8s .2s cubic-bezier(.2,.9,.3,1.2) forwards}
.halo{position:absolute;left:50%;top:8%;width:min(90%,400px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff 0,#eae2ff 35%,#cdbdff 75%,#b8a4ff 100%);box-shadow:0 26px 70px rgba(110,70,220,.22),inset 0 0 0 10px rgba(255,255,255,.55)}
.neko{position:relative;z-index:1;height:440px;width:auto;max-width:100%;object-fit:contain;cursor:pointer;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 14px 18px rgba(70,35,150,.2));transform-origin:50% 100%;animation:sway 5s ease-in-out infinite;margin-bottom:12px}
.neko.sw{animation:sw .34s ease}
.tear{position:absolute;z-index:2;color:#8fb8ff;font-size:16px;opacity:0;animation:drop 2.6s ease-in infinite}
footer{margin-top:40px;font-size:13px;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap}footer a{color:var(--violet)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
@keyframes sway{50%{transform:translateY(-5px) rotate(-1deg)}}
@keyframes sw{35%{transform:scaleX(1.05) scaleY(.92)}70%{transform:scaleX(.97) scaleY(1.04)}100%{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(60px)}}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:10px}.art{order:-1;min-height:300px}.neko{height:300px}.halo{width:min(80%,300px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="https://chromewebstore.google.com/detail/pggapfaakjffefgmdlioapcllechjbhl"><img src="img/icon.png" alt="">NekoNext</a>
  <section class="hero">
    <div>
      <h1 id="t"></h1>
      <p class="lead" id="s"></p>
      <div class="rs" id="rs"></div>
      <div class="err" id="err"></div>
      <div class="more" id="more">
        <div class="ok" id="ok"></div>
        <div id="siteBox" style="display:none"><label for="site" id="siteQ"></label><input id="site" maxlength="80" autocomplete="off"></div>
        <label for="note" id="noteQ"></label><textarea id="note" maxlength="400"></textarea>
        <div class="row"><span class="sent" id="sent"></span><button class="btn p" id="send"></button></div>
      </div>
      <div class="back"><span id="re"></span><a class="btn s" id="reBtn" href="https://chromewebstore.google.com/detail/pggapfaakjffefgmdlioapcllechjbhl" target="_blank" rel="noopener"></a></div>
      <div class="anon" id="anon"></div>
    </div>
    <div class="art" id="art">
      <div class="halo"></div>
      <img class="neko" id="neko" src="img/neko-uzgun-3.webp" alt="Neko" width="324" height="700">
    </div>
  </section>
  <footer><span>© NekoNext · Bak'bi Nick</span><a href="privacy.html" id="priv"></a></footer>
</div>
<script src="bye.js"></script>
</body>
</html>
