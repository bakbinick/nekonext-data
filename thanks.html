<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="nekonext-thanks" content="1">
<title>NekoNext · Teşekkürler 💜</title>
<meta name="description" content="NekoNext'e destek olduğun için teşekkürler.">
<meta property="og:title" content="NekoNext · Teşekkürler 💜">
<meta property="og:image" content="https://bakbinick.github.io/nekonext-data/img/og-tesekkur.jpg">
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f6f0ff; --ink:#24183f; --mut:#5e507f; --line:#e3d8fb; --violet:#6d4ae0; --violet2:#8a6bff; --heart:#ff5c8a; --card:#ffffff;
  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{min-height:100vh;color:var(--ink);font:17px/1.6 var(--body);
  background:radial-gradient(900px 600px at 100% -10%,rgba(255,143,184,.28),transparent 60%),radial-gradient(900px 700px at -10% 110%,rgba(124,92,255,.22),transparent 60%),var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding:28px 24px 48px}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font:800 20px var(--display);color:var(--violet);text-decoration:none}.brand img{width:34px;height:34px;border-radius:9px}
.lang{font-size:13px;color:var(--mut)}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;margin-top:36px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;color:var(--violet);box-shadow:0 6px 18px rgba(109,74,224,.12);opacity:0;animation:up .6s .1s ease forwards}
h1{font:800 clamp(44px,6.4vw,76px)/1 var(--display);margin:18px 0 14px;letter-spacing:-.01em;white-space:nowrap}
h1 span{display:inline-block;opacity:0;transform:translateY(18px);animation:up .55s ease forwards}
h1 .h{color:var(--heart);display:inline-block;font-size:.62em;margin-left:.18em;vertical-align:.12em;animation:up .55s ease forwards,beat 1.6s 1.6s ease-in-out infinite}
.lead{font-size:19px;color:var(--mut);max-width:34ch;margin:0 0 22px;opacity:0;animation:up .6s .9s ease forwards}
.ok{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;max-width:460px;margin-bottom:24px;box-shadow:0 10px 26px rgba(60,30,120,.08);opacity:0;animation:up .6s 1.05s ease forwards}
.ok i{flex:0 0 28px;height:28px;border-radius:50%;background:#e9fbf2;color:#1d9a64;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900}
.ok span{font-size:15px;color:var(--mut)}
.btns{display:flex;flex-wrap:wrap;gap:12px;opacity:0;animation:up .6s 1.2s ease forwards}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:800 16px var(--body);border-radius:14px;padding:13px 20px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn.p{color:#fff;background:linear-gradient(135deg,var(--violet2),var(--violet));box-shadow:0 12px 28px rgba(109,74,224,.35)}
.btn.s{color:var(--violet);background:#fff;border:1px solid var(--line)}
/* görsel: arka plansız Neko, rastgele poz */
.art{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:600px;opacity:0;animation:pop .8s .25s cubic-bezier(.2,.9,.3,1.2) forwards}
.halo{position:absolute;left:50%;top:6%;width:min(92%,500px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff 0,#ffe0ec 30%,#d9c8ff 68%,#b9a0ff 100%);box-shadow:0 30px 80px rgba(110,70,220,.28),inset 0 0 0 10px rgba(255,255,255,.55)}
.spark{position:absolute;color:#b79bff;font-size:22px;animation:tw 2.4s ease-in-out infinite}
.floor{position:absolute;bottom:14px;left:50%;width:46%;height:22px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(60,30,120,.28),transparent);animation:sh 6s ease-in-out infinite}
.neko{position:relative;z-index:1;height:580px;width:auto;cursor:pointer;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 14px 18px rgba(70,35,150,.22));transform-origin:50% 100%;animation:bob 6s ease-in-out infinite;margin-bottom:22px}
.neko.sw{animation:sw .34s ease}
.hearts{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
.hearts span{position:absolute;bottom:10%;width:18px;height:18px;opacity:0;animation:float var(--t) var(--d) ease-in infinite}
.burst span{position:absolute;left:50%;top:45%;width:22px;height:22px;opacity:0;animation:burst 1.4s ease-out forwards}
.tag{position:absolute;z-index:3;left:0;top:30%;background:#fff;border-radius:16px 16px 16px 4px;padding:10px 14px;font-weight:800;font-size:14px;box-shadow:0 14px 30px rgba(60,30,120,.2);display:flex;gap:8px;align-items:center;animation:bob 5s 1s ease-in-out infinite}
@keyframes sw{0%{transform:scale(1)}35%{transform:scaleX(1.06) scaleY(.9)}70%{transform:scaleX(.97) scaleY(1.05)}100%{transform:none}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes sh{50%{transform:translateX(-50%) scale(.88);opacity:.8}}
/* desteğin neye dönüşüyor */
.next{margin-top:56px;opacity:0;animation:up .6s 1.4s ease forwards}
.next h2{font:800 26px var(--display);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 10px 26px rgba(60,30,120,.07)}
.c .e{font-size:30px}.c b{display:block;font-size:18px;margin:6px 0 4px}.c span{color:var(--mut);font-size:15px}
footer{margin-top:40px;font-size:13px;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap}footer a{color:var(--violet)}
@keyframes up{to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
@keyframes float{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--x),-340px) scale(1.1) rotate(var(--r))}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1) rotate(var(--r))}}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:20px}.art{order:-1;width:100%;max-width:440px;margin:0 auto;min-height:440px}.neko{height:420px}.grid{grid-template-columns:1fr}.tag{left:0;top:auto;bottom:34%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="brand" href="https://chromewebstore.google.com/detail/pggapfaakjffefgmdlioapcllechjbhl"><img src="img/icon.png" alt="">NekoNext</a></div>
  <section class="hero">
    <div>
      <div class="chip">💜 <span id="chip"></span></div>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
      <div class="ok"><i>✓</i><span id="note"></span></div>
      <div class="btns">
        <a class="btn p" id="dl" href="https://app.lemonsqueezy.com/my-orders" target="_blank" rel="noopener">🎁 <span></span></a>
        <a class="btn s" id="back" href="https://chromewebstore.google.com/detail/pggapfaakjffefgmdlioapcllechjbhl" target="_blank" rel="noopener">⭐ <span></span></a>
      </div>
    </div>
    <div class="art" id="art">
      <div class="halo"></div><div class="floor"></div>
      <span class="spark" style="left:10%;top:14%">✦</span><span class="spark" style="right:9%;top:26%;animation-delay:.8s">✦</span><span class="spark" style="right:16%;bottom:22%;animation-delay:1.5s;font-size:16px">✦</span>
      <img class="neko" id="frame" src="img/neko-heart.webp" alt="Neko" width="493" height="741">
      <div class="hearts" id="hearts"></div>
      <div class="tag">🐾 <span id="tag"></span></div>
    </div>
  </section>
  <section class="next">
    <h2 id="nh"></h2>
    <div class="grid">
      <div class="c"><div class="e">✨</div><b id="n1t"></b><span id="n1d"></span></div>
      <div class="c"><div class="e">👥</div><b id="n2t"></b><span id="n2d"></span></div>
      <div class="c"><div class="e">🎨</div><b id="n3t"></b><span id="n3d"></span></div>
    </div>
  </section>
  <footer><span>© NekoNext · Bak'bi Nick</span><a href="privacy.html" id="priv"></a></footer>
</div>
<script src="thanks.js"></script>
</body>
</html>
